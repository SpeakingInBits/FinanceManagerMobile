[package]
name = "finance-app"
description = "Finance Tracker for iOS, Android and desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib for Android (loaded by NativeActivity); rlib so the desktop/iOS binary can link it.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "finance-tracker"
path = "src/main.rs"

[dependencies]
finance-core = { path = "../core" }
indexmap = "2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "accessibility"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
dirs = "6"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06", "renderer-femtovg"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Slint's iOS support goes through winit + the Skia renderer.
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-skia"] }

[dev-dependencies]
# Runs the real UI without a window for the UI tests in src/ui_tests.rs.
i-slint-backend-testing = "=1.18.1"
tempfile = "3"

[build-dependencies]
slint-build = "1.18"
